security:
    password_hashers:
        App\Entity\User:
            algorithm: bcrypt

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Public routes — no auth required
        login:
            pattern:  ^/api/auth/login
            stateless: true
            security: false

        # Chatbot — public (no JWT required)
        chatbot:
            pattern:  ^/api/chatbot
            stateless: true
            security: false

        # JWT-protected API
        api:
            pattern:   ^/api
            stateless: true
            provider:  app_user_provider
            jwt: ~

    access_control:
        # Auth routes public
        - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/chatbot,    roles: PUBLIC_ACCESS }

        # Dashboard — Manager or RH
        - { path: ^/api/dashboard, roles: [ROLE_MANAGER, ROLE_RH] }

        # Employee CRUD — Manager or RH only
        - { path: ^/api/employes, roles: [ROLE_MANAGER, ROLE_RH], methods: [POST, PUT, DELETE] }
        - { path: ^/api/employes, roles: IS_AUTHENTICATED_FULLY, methods: [GET] }

        # Contrats, Projets, Evaluations — Manager or RH
        - { path: ^/api/contrats,   roles: [ROLE_MANAGER, ROLE_RH] }
        - { path: ^/api/evaluations, roles: [ROLE_MANAGER] }

        # Congés — all authenticated (employees submit, managers approve)
        - { path: ^/api/conges/[0-9]+/approve, roles: [ROLE_MANAGER, ROLE_RH] }
        - { path: ^/api/conges/[0-9]+/refuse,  roles: [ROLE_MANAGER, ROLE_RH] }
        - { path: ^/api/conges, roles: IS_AUTHENTICATED_FULLY }

        # Dossiers — all authenticated
        - { path: ^/api/dossiers/[0-9]+/valider, roles: [ROLE_MANAGER, ROLE_RH] }
        - { path: ^/api/dossiers, roles: IS_AUTHENTICATED_FULLY }

        # All other API routes
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
